name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required check. Install, build, and now unit tests: this PR adds the
  # first executable Jest suite (jest.config.js) and its own `test` script.
  # Lint is still a Phase 0 repair (no ESLint config exists) and remains out.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --ci

  # Report-only: today's tree has advisories at the critical level, so a
  # blocking audit would fail every PR. The step itself always exits 0
  # (`|| true`) and writes the findings to the job summary instead, so the
  # check stays green while the advisories stay visible.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (critical, report only)
        run: |
          npm audit --audit-level=critical > audit.txt 2>&1 || true
          cat audit.txt
          { echo "### npm audit (report only)"; echo '```'; tail -n 80 audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
