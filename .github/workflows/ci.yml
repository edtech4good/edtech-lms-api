name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required check. Install, build, and now unit tests: this PR adds the
  # first executable Jest suite (jest.config.js) and its own `test` script.
  # Lint is still a Phase 0 repair (no ESLint config exists) and remains out.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --ci

  # Report-only: today's tree has advisories at the critical level, so a
  # blocking audit would fail every PR. The step itself always exits 0
  # (`|| true`) and writes the findings to the job summary instead, so the
  # check stays green while the advisories stay visible.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (critical, report only)
        run: |
          npm audit --audit-level=critical > audit.txt 2>&1 || true
          cat audit.txt
          { echo "### npm audit (report only)"; echo '```'; tail -n 80 audit.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # Report-only for now (not a required check). Builds a database from the migrations
  # alone on a stock MySQL 8.0 server (default collation, utf8mb4_0900_ai_ci), boots the
  # built server once, and fails if boot changed the schema, if a model declares a table,
  # column or index that no migration creates, or if a migration fails on that server.
  # See scripts/ci/schema-drift.sh. The password below is a throwaway for a service
  # container that exists only for this job.
  schema-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-throwaway-root
          MYSQL_DATABASE: edtech_lms_drift
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-throwaway-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci-throwaway-root
      DB_NAME: edtech_lms_drift
      PORT: 3000
      NODE_ENV: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Migrate an empty database, boot once, diff the schema
        run: scripts/ci/schema-drift.sh
